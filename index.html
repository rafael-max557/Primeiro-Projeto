<!DOCTYPE html> 
<html lang="pt-br"> 
  <head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Flashcards de Mitos e Verdades</title> 
    <link rel="stylesheet" href="style.css" />
  </head> 
  <body> 
    <header> 
      <h1>Confere Aí</h1> 
      <nav> 
        <a href="#">Início</a> 
      </nav> 
    </header> 
 
    <main> 
      <h2>Descubra a verdade passando o mouse</h2> 
      <section class="container-cards"> 
        <article class="cartao"> 
          <div class="cartao-conteudo"> 
            <!-- FRENTE DO CARTÃO (O Mito) -->
            <div class="cartao-frente"> 
              <img src="https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=500" alt="Ilustração de cuidados de saúde" class="cartao-imagem"> 
              <p><strong>Mito:</strong> Gargarejo com água morna e sal cura infecções e elimina o vírus da COVID-19.</p> 
            </div> 
            <!-- VERSO DO CARTÃO (A Verdade) -->
            <div class="cartao-verso"> 
              <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=500" alt="Médico em consulta" class="cartao-imagem"> 
              <p><strong>Verdade:</strong> Ajuda a aliviar dor de garganta, mas não elimina vírus. Consulte sempre um médico!</p> 
            </div> 
          </div> 
        </article> 
      </section> 
    </main> 
 
    <footer> 
      <p>Projeto feito por RAFAEL LINDO</p> 
    </footer> 
  </body> 
</html>
